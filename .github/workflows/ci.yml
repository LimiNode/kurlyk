name: CI

on:
  push:
    branches: [ main, stable, wip/raw-development ]
  pull_request:
    branches: [ main ]

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        std: [11, 17]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - run: git submodule update --init --recursive
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev ninja-build
      - name: Build smoke test
        run: c++ tests/smoke/header_smoke.cpp -Iinclude -std=c++${{ matrix.std }} -o header_smoke
      - name: Run smoke test
        run: ./header_smoke
      - name: Build C++11 HTTP header smoke test
        run: c++ tests/smoke/http_header_smoke.cpp -Iinclude -std=c++11 -o http_header_smoke
      - name: Build standalone ProxyConfig smoke test
        run: c++ tests/smoke/proxy_config_smoke.cpp -Iinclude -std=c++11 -o proxy_config_smoke
      - name: Run extended C++11 smoke tests
        run: ./http_header_smoke && ./proxy_config_smoke
      - name: Configure full C++11 HTTP/WebSocket smoke test
        if: matrix.std == 11
        run: |
          cmake -S tests/smoke \
                -B build-linux-full-cpp11-smoke \
                -G Ninja \
                -DCMAKE_CXX_STANDARD=11 \
                -DCMAKE_CXX_STANDARD_REQUIRED=ON \
                -DKURLYK_USE_STANDALONE_ASIO=ON \
                -DKURLYK_USE_FALLBACK_ASIO=ON \
                -DKURLYK_USE_FALLBACK_SIMPLE_WS_SERVER=ON \
                -Wno-dev
      - name: Build full C++11 HTTP/WebSocket smoke test
        if: matrix.std == 11
        run: cmake --build build-linux-full-cpp11-smoke
      - name: Configure Linux CMake build
        run: |
          cmake -S . \
                -B build-linux-cmake-${{ matrix.std }} \
                -G Ninja \
                -DCMAKE_CXX_STANDARD=${{ matrix.std }} \
                -DCMAKE_CXX_STANDARD_REQUIRED=ON \
                -DKURLYK_BUILD_EXAMPLES=ON \
                -DKURLYK_USE_FALLBACK_ASIO=ON \
                -DKURLYK_USE_FALLBACK_SIMPLE_WS_SERVER=ON \
                -Wno-dev
      - name: Build Linux CMake examples
        run: cmake --build build-linux-cmake-${{ matrix.std }}

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - run: git submodule update --init --recursive
      - name: Install package test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev ninja-build
      - name: Configure packaging build
        run: |
          cmake -S . \
                -B build-package \
                -G Ninja \
                -DKURLYK_BUILD_EXAMPLES=OFF \
                -DKURLYK_USE_FALLBACK_ASIO=ON \
                -DKURLYK_USE_FALLBACK_SIMPLE_WS_SERVER=ON \
                -Wno-dev
      - name: Install package to staging
        run: cmake --install build-package --prefix "$PWD/build-package-stage"
      - name: Verify installed package contents
        run: cmake -DKURLYK_STAGE_DIR="$PWD/build-package-stage" -P tests/package/verify_install.cmake
      - name: Configure external package consumer
        run: |
          cmake -S tests/package/consumer \
                -B build-package-consumer \
                -G Ninja \
                -DCMAKE_PREFIX_PATH="$PWD/build-package-stage" \
                -DKURLYK_ASIO_INCLUDE_DIR="$PWD/external/asio/include" \
                -DCMAKE_CXX_STANDARD=11 \
                -DCMAKE_CXX_STANDARD_REQUIRED=ON \
                -Wno-dev
      - name: Build external package consumer
        run: cmake --build build-package-consumer
      - name: Set up vcpkg
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git "$RUNNER_TEMP/vcpkg"
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
      - name: Install overlay vcpkg port
        run: |
          "$RUNNER_TEMP/vcpkg/vcpkg" install kurlyk \
            --overlay-ports="$PWD/ports" \
            --triplet=x64-linux
      - name: Configure vcpkg package consumer
        run: |
          cmake -S tests/package/consumer \
                -B build-vcpkg-consumer \
                -G Ninja \
                -DCMAKE_TOOLCHAIN_FILE="$RUNNER_TEMP/vcpkg/scripts/buildsystems/vcpkg.cmake" \
                -DVCPKG_TARGET_TRIPLET=x64-linux \
                -DCMAKE_CXX_STANDARD=11 \
                -DCMAKE_CXX_STANDARD_REQUIRED=ON \
                -Wno-dev
      - name: Build vcpkg package consumer
        run: cmake --build build-vcpkg-consumer

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - run: git submodule update --init --recursive
      - name: Install macOS dependencies
        run: brew install ninja curl openssl@3
      - name: Build and run C++11 header smoke test
        run: clang++ tests/smoke/header_smoke.cpp -Iinclude -std=c++11 -o header_smoke_cpp11 && ./header_smoke_cpp11
      - name: Build and run C++17 header smoke test
        run: clang++ tests/smoke/header_smoke.cpp -Iinclude -std=c++17 -o header_smoke_cpp17 && ./header_smoke_cpp17
      - name: Build C++11 HTTP header smoke test
        run: clang++ tests/smoke/http_header_smoke.cpp -Iinclude -I"$(brew --prefix curl)/include" -std=c++11 -o http_header_smoke
      - name: Build standalone ProxyConfig smoke test
        run: clang++ tests/smoke/proxy_config_smoke.cpp -Iinclude -std=c++11 -o proxy_config_smoke
      - name: Run extended C++11 smoke tests
        run: ./http_header_smoke && ./proxy_config_smoke
      - name: Configure full C++11 HTTP/WebSocket smoke test
        run: |
          OSSL="$(brew --prefix openssl@3)"
          CURL="$(brew --prefix curl)"
          PATH="$CURL/bin:$PATH" cmake -S tests/smoke \
            -B build-macos-full-cpp11-smoke \
            -G Ninja \
            -DCMAKE_CXX_STANDARD=11 \
            -DCMAKE_CXX_STANDARD_REQUIRED=ON \
            -DOPENSSL_ROOT_DIR="$OSSL" \
            -DCMAKE_PREFIX_PATH="$OSSL;$CURL" \
            -DKURLYK_USE_STANDALONE_ASIO=ON \
            -DKURLYK_USE_FALLBACK_ASIO=ON \
            -DKURLYK_USE_FALLBACK_SIMPLE_WS_SERVER=ON \
            -Wno-dev
      - name: Build full C++11 HTTP/WebSocket smoke test
        run: cmake --build build-macos-full-cpp11-smoke
      - name: Configure macOS integration build
        run: |
          OSSL="$(brew --prefix openssl@3)"
          CURL="$(brew --prefix curl)"
          PATH="$CURL/bin:$PATH" cmake -S tests/integration \
            -B build-macos \
            -G Ninja \
            -DCMAKE_CXX_STANDARD=17 \
            -DCMAKE_CXX_STANDARD_REQUIRED=ON \
            -DOPENSSL_ROOT_DIR="$OSSL" \
            -DCMAKE_PREFIX_PATH="$OSSL;$CURL" \
            -DKURLYK_USE_FALLBACK_ASIO=ON \
            -DKURLYK_USE_FALLBACK_SIMPLE_WS_SERVER=ON \
            -Wno-dev
      - name: Build macOS integration
        run: cmake --build build-macos
      - name: Run macOS integration
        run: ctest --test-dir build-macos --output-on-failure

  windows:
    name: ${{ matrix.suite }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: mingw-integration
            generator: Ninja
            preload_deps: OFF
            openssl_shared: ON
            curl_shared: ON
          - suite: msvc-integration
            generator: Ninja
            preload_deps: ON
            openssl_shared: ON
            curl_shared: ON
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - run: git submodule update --init --recursive

      - name: Set up MSYS2
        if: matrix.suite == 'mingw-integration'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja

      - name: Verify MinGW toolchain
        if: matrix.suite == 'mingw-integration'
        shell: msys2 {0}
        run: |
          gcc --version
          cmake --version
          ninja --version

      - name: Set up MSVC
        if: matrix.suite == 'msvc-integration'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure MinGW integration
        if: matrix.suite == 'mingw-integration'
        shell: msys2 {0}
        run: |
          cmake -S tests/integration \
                -B build-${{ matrix.suite }} \
                -G "${{ matrix.generator }}" \
                -DCMAKE_C_COMPILER=gcc \
                -DCMAKE_CXX_COMPILER=g++ \
                -DKURLYK_USE_FALLBACK_OPENSSL=ON \
                -DKURLYK_USE_FALLBACK_CURL=ON \
                -DKURLYK_USE_FALLBACK_ASIO=ON \
                -DKURLYK_USE_FALLBACK_SIMPLE_WS_SERVER=ON \
                -DKURLYK_TEST_PRELOAD_DEPS=${{ matrix.preload_deps }} \
                -DKURLYK_OPENSSL_SHARED=${{ matrix.openssl_shared }} \
                -DKURLYK_CURL_SHARED=${{ matrix.curl_shared }} \
                -DCMAKE_CXX_STANDARD=17 \
                -DCMAKE_CXX_STANDARD_REQUIRED=ON \
                -Wno-dev

      - name: Configure MSVC integration
        if: matrix.suite == 'msvc-integration'
        shell: pwsh
        run: |
          cmake -S tests/integration `
                -B build-${{ matrix.suite }} `
                -G "${{ matrix.generator }}" `
                -DKURLYK_USE_FALLBACK_OPENSSL=ON `
                -DKURLYK_USE_FALLBACK_CURL=ON `
                -DKURLYK_USE_FALLBACK_ASIO=ON `
                -DKURLYK_USE_FALLBACK_SIMPLE_WS_SERVER=ON `
                -DKURLYK_TEST_PRELOAD_DEPS=${{ matrix.preload_deps }} `
                -DKURLYK_OPENSSL_SHARED=${{ matrix.openssl_shared }} `
                -DKURLYK_CURL_SHARED=${{ matrix.curl_shared }} `
                -DCMAKE_BUILD_TYPE=Release `
                -DCMAKE_CXX_STANDARD=17 `
                -DCMAKE_CXX_STANDARD_REQUIRED=ON `
                -Wno-dev

      - name: Build MinGW integration
        if: matrix.suite == 'mingw-integration'
        shell: msys2 {0}
        run: cmake --build build-${{ matrix.suite }}

      - name: Build MSVC integration
        if: matrix.suite == 'msvc-integration'
        run: cmake --build build-${{ matrix.suite }} --config Release

      - name: Run MinGW integration suite
        if: matrix.suite == 'mingw-integration'
        shell: msys2 {0}
        run: ctest --test-dir build-${{ matrix.suite }} --output-on-failure

      - name: Run MSVC integration suite
        if: matrix.suite == 'msvc-integration'
        shell: pwsh
        run: ctest --test-dir build-${{ matrix.suite }} -C Release --output-on-failure

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.suite }}
          path: |
            build-${{ matrix.suite }}/CMakeFiles/CMakeOutput.log
            build-${{ matrix.suite }}/Testing/Temporary/LastTest.log
          if-no-files-found: ignore

  windows-extras:
    name: ${{ matrix.suite }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [odr]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - run: git submodule update --init --recursive

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja

      - name: Verify MinGW toolchain
        shell: msys2 {0}
        run: |
          gcc --version
          cmake --version
          ninja --version

      - name: Configure ODR checks
        shell: msys2 {0}
        run: |
          cmake -S tests/odr \
                -B build-odr \
                -G Ninja \
                -DCMAKE_C_COMPILER=gcc \
                -DCMAKE_CXX_COMPILER=g++ \
                -Wno-dev

      - name: Build ODR checks
        shell: msys2 {0}
        run: cmake --build build-odr

      - name: Run singleton ODR check
        shell: msys2 {0}
        run: ./build-odr/src_files.exe

      - name: Run auto-init ODR check
        shell: msys2 {0}
        run: ./build-odr/odr_autoinit.exe

      - name: Run synchronous lifecycle check
        shell: msys2 {0}
        run: ./build-odr/lifecycle_sync.exe

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.suite }}
          path: |
            build-odr/CMakeFiles/CMakeOutput.log
            build-odr/Testing/Temporary/LastTest.log
          if-no-files-found: ignore

  auth-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - run: git submodule update --init --recursive
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev ninja-build
      - name: Configure auth tests
        run: |
          cmake -S tests/auth \
                -B build-auth-tests \
                -G Ninja \
                -DKURLYK_BUILD_EXAMPLES=OFF \
                -DKURLYK_USE_FALLBACK_ASIO=ON \
                -DKURLYK_USE_FALLBACK_SIMPLE_WS_SERVER=ON \
                -Wno-dev
      - name: Build auth tests
        run: cmake --build build-auth-tests
      - name: Run auth tests
        run: ctest --test-dir build-auth-tests --output-on-failure
      - name: Configure bearer-only example (OAuth disabled)
        run: |
          cmake -S . \
                -B build-bearer-only \
                -G Ninja \
                -DKURLYK_BUILD_EXAMPLES=ON \
                -DKURLYK_OAUTH_SUPPORT=OFF \
                -DKURLYK_USE_FALLBACK_ASIO=ON \
                -DKURLYK_USE_FALLBACK_SIMPLE_WS_SERVER=ON \
                -Wno-dev
      - name: Build bearer-only example
        run: cmake --build build-bearer-only --target simple_bearer_auth_example
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-auth-tests
          path: |
            build-auth-tests/CMakeFiles/CMakeOutput.log
            build-auth-tests/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
